<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Espelho do Teto — Diagnóstico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090B10;
      --card-bg: #11141D;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --amber: #F59E0B;
      --amber-glow: rgba(245, 158, 11, 0.15);
      --border: #1E293B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      color: var(--amber);
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--amber);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 24px;
      color: var(--text-main);
      text-align: center;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 18px 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.95rem; /* Ajustado para leitura confortável no mobile */
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:active, .option-btn:hover {
      border-color: var(--amber);
      background: var(--amber-glow);
    }

    .result-card {
      display: none;
      text-align: left;
    }

    .result-tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--amber);
      margin-bottom: 8px;
    }

    .result-title {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: #FFF;
      margin-bottom: 16px;
    }

    .result-section {
      margin-bottom: 16px;
    }

    .result-section h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .result-section p {
      font-size: 0.95rem; /* 16px equivalente legível */
      color: var(--text-main);
      line-height: 1.5;
    }

    .copy-btn {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: var(--amber);
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>O Espelho do Teto</h1>
      <p>Escolha por impulso. Sem pensar.</p>
    </header>

    <div id="quiz-screen">
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="question-title" id="question-text">Carregando...</div>
      <div class="options" id="options-container"></div>
    </div>

    <div class="result-card" id="result-screen">
      <span class="result-tag" id="res-tag">Mecanismo Oculto Revelado</span>
      <h2 class="result-title" id="res-title"></h2>
      
      <div class="result-section">
        <h3>O Diagnóstico</h3>
        <p id="res-diag"></p>
      </div>

      <div class="result-section">
        <h3>O Espelhamento</h3>
        <p id="res-espelho"></p>
      </div>

      <div class="result-section">
        <h3>A Convocação</h3>
        <p id="res-convocacao"></p>
      </div>

      <button class="copy-btn" onclick="copyResult()">Copiar Resultado para os Stories</button>
    </div>

    <footer>
      @observadordeteto
    </footer>
  </div>

  <script>
    const questions = [
      {
        q: "Diante de um silêncio prolongado e repentino:",
        options: [
          { text: "Tento decodificar o motivo lógico daquele vazio.", type: "A" },
          { text: "Ligo qualquer som ou abro uma tela para preencher o espaço.", type: "B" },
          { text: "Calculo mentalmente o que preciso resolver em seguida.", type: "C" },
          { text: "Apenas observo o tempo passar, estático.", type: "D" }
        ]
      },
      {
        q: "Quando o plano desaba e o controle escapa das mãos:",
        options: [
          { text: "Isolo o sentimento e foco puramente na correção técnica.", type: "A" },
          { text: "Busco um alívio imediato para esquecer o problema.", type: "B" },
          { text: "Reorganizo freneticamente todas as variáveis ao redor.", type: "C" },
          { text: "Enxergo a falha completa, mas continuo onde estou.", type: "D" }
        ]
      },
      {
        q: "O peso invisível do dia acumulou no peito. O seu reflexo imediato é:",
        options: [
          { text: "Tratar a dor como um dado estatístico a ser resolvido.", type: "A" },
          { text: "Fugir para o piloto automático das distrações digitais.", type: "B" },
          { text: "Antecipar cenários futuros para tentar me blindar.", type: "C" },
          { text: "Assistir à própria exaustão como um espectador cansado.", type: "D" }
        ]
      },
      {
        q: "Ao encarar o próprio reflexo no escuro por dez segundos:",
        options: [
          { text: "Vejo engrenagens que precisam de ajuste funcional.", type: "A" },
          { text: "Desvio o olhar rapidamente para o primeiro estímulo.", type: "B" },
          { text: "Penso nas metas que preciso cumprir nos próximos anos.", type: "C" },
          { text: "Reconheço a estagnação exata em que me coloquei.", type: "D" }
        ]
      }
    ];

    const archetypes = {
      A: {
        title: "O CIRÚRGICO (A Lâmina)",
        diag: "Você racionaliza a vida para não precisar senti-la. Transforma angústias em equações lógicas porque tentar entender o motivo de uma dor parece mais seguro do que ter a coragem de ser vulnerável.",
        espelho: "Analisar o seu problema não é o mesmo que curá-lo. Sua inteligência virou um esconderijo refinado para o medo de perder o controle.",
        convocacao: "Pare de buscar justificativas lógicas para o que sente. Suporte o peso do momento por dois minutos em silêncio sem tentar explicá-lo."
      },
      B: {
        title: "O ANESTESIADO (O Nevoeiro)",
        diag: "O seu maior pavor é o silêncio. Você mantém a mente ocupada o tempo todo com telas, ruídos e estímulos rasos para garantir que nunca vai precisar encarar o abismo de estar a sós consigo mesmo.",
        espelho: "Você não está cansado do mundo; está exausto de rodar o piloto automático para anestesiar a própria presença.",
        convocacao: "Deixe o celular em outro cômodo hoje. Encare o teto em silêncio absoluto até o sono vir, sem fugir para nenhum estímulo visual."
      },
      C: {
        title: "O ARQUITETO (A Estrutura)",
        diag: "Sua cabeça vive passos à frente, criando cenários e planos de emergência para coisas que nem aconteceram. Você acredita que, se planejar o suficiente, nada poderá te ferir.",
        espelho: "O seu perfeccionismo não é busca por excelência; é o seu ego aterrorizado com a falha. O excesso de preparação é uma desculpa elegante para não agir.",
        convocacao: "Escolha a decisão que você está adiando há meses e dê o primeiro passo hoje de forma imperfeita."
      },
      D: {
        title: "O OBSERVADOR (A Testemunha)",
        diag: "Você enxerga com clareza absoluta onde está errando e entende os seus padrões destrutivos como ninguém. Porém, usa essa lucidez como uma cadeira de balanço.",
        espelho: "Você virou um espectador da própria existência. Lucidez sem ação não é sabedoria; é só covardia consciente.",
        convocacao: "Pare de analisar a estagnação. Escolha uma única atitude prática que quebre a sua rotina hoje e execute-a imediatamente."
      }
    };

    let currentQ = 0;
    const scores = { A: 0, B: 0, C: 0, D: 0 };

    function loadQuestion() {
      const q = questions[currentQ];
      document.getElementById('question-text').innerText = q.q;
      
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        container.appendChild(btn);
      });

      const progressPercent = ((currentQ) / questions.length) * 100;
      document.getElementById('progress').style.width = `${progressPercent}%`;
    }

    function selectOption(type) {
      scores[type]++;
      currentQ++;

      if (currentQ < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').style.display = 'none';
      const resultScreen = document.getElementById('result-screen');
      resultScreen.style.display = 'block';

      let winner = 'A';
      let maxScore = -1;
      for (const [type, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          winner = type;
        }
      }

      const res = archetypes[winner];
      document.getElementById('res-title').innerText = res.title;
      document.getElementById('res-diag').innerText = res.diag;
      document.getElementById('res-espelho').innerText = res.espelho;
      document.getElementById('res-convocacao').innerText = res.convocacao;
    }

    function copyResult() {
      const title = document.getElementById('res-title').innerText;
      const espelho = document.getElementById('res-espelho').innerText;
      const text = `Meu resultado no Espelho do Teto:\n\n${title}\n"${espelho}"\n\nDescubra o seu em: @observadordeteto`;
      
      navigator.clipboard.writeText(text).then(() => {
        alert('Resultado copiado! Cole direto nos seus Stories.');
      });
    }

    loadQuestion();
  </script>
</body>
</html>
