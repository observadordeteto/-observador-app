<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Espelho do Teto — Diagnóstico</title>
  
  <meta property="og:title" content="O Espelho do Teto — Diagnóstico Comportamental">
  <meta property="og:description" content="Descubra o perfil secreto da sua mente e seu padrão comportamental.">
  <meta property="og:image" content="capa.png">
  <meta property="og:url" content="https://observadordeteto.github.io/app/">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090E;
      --card-bg: rgba(13, 17, 26, 0.92);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --amber: #F59E0B;
      --amber-glow: rgba(245, 158, 11, 0.25);
      --border: rgba(245, 158, 11, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: linear-gradient(rgba(7, 9, 14, 0.88), rgba(7, 9, 14, 0.88)), url('fundo.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.85), 0 0 35px rgba(245, 158, 11, 0.08);
      text-align: center;
      overflow: hidden;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: var(--amber);
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .fade-anim {
      animation: slideFadeIn 0.35s ease forwards;
    }

    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .intro-screen p {
      font-size: 1.05rem;
      color: var(--text-main);
      line-height: 1.6;
      margin-bottom: 24px;
      text-align: left;
    }

    .start-btn, .share-btn {
      width: 100%;
      padding: 18px;
      background: var(--amber);
      color: #07090E;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      margin-top: 15px;
    }

    .start-btn:hover, .share-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .quiz-screen, .result-card {
      display: none;
      text-align: left;
    }

    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--amber);
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .statement-box {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
      color: var(--text-main);
      text-align: center;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scale-instruction {
      font-size: 0.85rem;
      color: var(--amber);
      text-align: center;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .scale-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scale-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 12px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .scale-btn-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scale-btn-icon {
      font-size: 1.1rem;
    }

    .scale-badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--amber);
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .scale-btn:active, .scale-btn:hover {
      border-color: var(--amber);
      background: var(--amber-glow);
    }

    .result-tag {
      display: inline-block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--amber);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .result-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: #FFF;
      margin-bottom: 18px;
      line-height: 1.3;
    }

    .result-section {
      margin-bottom: 18px;
    }

    .result-section h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 6px;
      letter-spacing: 1.5px;
    }

    .result-section p {
