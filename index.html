<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Espelho do Teto - Diagnóstico do Perfil Mental</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050814;
            --indigo-void: #0a0f24;
            --electric-blue: #2a4365;
            --amber-gold: #d4af37;
            --amber-glow: #ffc107;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #111b3c 0%, var(--bg-deep) 80%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screen {
            display: none;
            width: 100%;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tela Inicial / Quiz */
        .card-box {
            background: rgba(10, 15, 36, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1, h2 {
            font-family: 'Cinzel', serif;
            color: var(--amber-gold);
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(135deg, var(--amber-gold), #b89728);
            color: #050814;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        /* Opções do Quiz */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 15px;
        }

        .option-btn {
            background: rgba(42, 67, 101, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--text-main);
            padding: 16px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .option-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--amber-gold);
            transform: translateX(4px);
        }

        /* Tela de Resultado */
        .result-image-container {
            width: 100%;
            max-width: 340px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }

        .result-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .deep-analysis {
            background: rgba(10, 15, 36, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            width: 100%;
        }

        .deep-analysis h3 {
            font-family: 'Cinzel', serif;
            color: var(--amber-gold);
            font-size: 1.1rem;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 6px;
        }

        .deep-analysis p {
            color: var(--text-main);
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .share-btn {
            background: linear-gradient(135deg, #ffc107, #d4af37);
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--amber-gold);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA 1: CAPA -->
        <div id="screen-welcome" class="screen active">
            <div class="card-box">
                <h1>O ESPELHO DO TETO</h1>
                <p>Descubra as engrenagens ocultas da sua mente através de um diagnóstico surrealista de perfil profundo.</p>
                <button class="btn" onclick="startQuiz()">Iniciar Diagnóstico</button>
            </div>
        </div>

        <!-- TELA 2: PERGUNTAS DO QUIZ -->
        <div id="screen-quiz" class="screen">
            <div class="card-box">
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
                <h2 id="question-title" style="font-size: 1.1rem; margin-bottom: 20px;">Pergunta</h2>
                <div id="options-container" class="options-container"></div>
            </div>
        </div>

        <!-- TELA 3: RESULTADO -->
        <div id="screen-result" class="screen">
            <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                
                <!-- O Card Visual Gerado -->
                <div class="result-image-container">
                    <img id="result-img" src="" alt="Seu Card de Arquétipo">
                </div>

                <!-- Botão de Compartilhar -->
                <button class="btn share-btn" onclick="shareResult()">✨ Compartilhar Card nos Stories</button>

                <!-- Texto Aprofundado -->
                <div class="deep-analysis">
                    <h3 id="analysis-title">Análise Profunda</h3>
                    <p id="analysis-text">Carregando análise...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                title: "Quando confrontado com o caos repentino ao seu redor, qual é a sua reação instintiva?",
                options: [
                    { text: "Isolar-se mentalmente para calcular a melhor rota de fuga ou solução.", archetype: "estrategico" },
                    { text: "Absorver a energia do caos e transformá-la em ação imediata e intensa.", archetype: "intensivo" },
                    { text: "Parar, analisar a estrutura invisível do problema e desenhar um plano de longo prazo.", archetype: "arquiteto" },
                    { text: "Observar em silêncio, recolhendo detalhes que ninguém mais percebeu.", archetype: "observador" }
                ]
            },
            {
                title: "Qual ambiente mental reflete melhor o seu santuário interno?",
                options: [
                    { text: "Uma sala de espelhos geométricos onde cada pensamento é pesado e medido.", archetype: "estrategico" },
                    { text: "Uma tempestade controlada de correntes de luz e eletricidade pura.", archetype: "intensivo" },
                    { text: "Uma grande oficina com plantas arquitetônicas e relógios ajustando o tempo.", archetype: "arquiteto" },
                    { text: "Um observatório silencioso voltado para um horizonte infinito e enigmático.", archetype: "observador" }
                ]
            },
            {
                title: "O que mais drena a sua energia nas relações sociais?",
                options: [
                    { text: "A falta de lógica e decisões baseadas puramente na emoção cega.", archetype: "estrategico" },
                    { text: "A lentidão, a apatia e a falta de pulso ou intensidade das pessoas.", archetype: "intensivo" },
                    { text: "A desorganização, falta de visão de futuro e improviso constante dos outros.", archetype: "arquiteto" },
                    { text: "A superficialidade, conversas vazias e máscaras sociais óbvias.", archetype: "observador" }
                ]
            }
        ];

        // Caminhos explicitamente definidos com ./ para resolução correta no GitHub Pages
        const resultsData = {
            estrategico: {
                image: "./resultado-estrategico.jpg",
                title: "Análise Profunda: O Estratégico",
                text: "Sua mente opera em frequências frias e calculistas. Enquanto o mundo reage no impulso, você antecipa os movimentos antes mesmo do tabuleiro se mover. Sua maior força é a clareza absoluta sob pressão, enxergando padrões onde os outros veem apenas confusão."
            },
            intensivo: {
                image: "./resultado-intensivo.jpg",
                title: "Análise Profunda: O Intensivo",
                text: "Você não sabe viver na superfície. Sua energia consome o espaço e transforma o ritmo ao seu redor. O que para os outros é excesso, para você é apenas a voltagem natural da sua existência, movida a impulsos de alta frequência."
            },
            arquiteto: {
                image: "./resultado-arquiteto.jpg",
                title: "Análise Profunda: O Arquiteto",
                text: "Suas mãos moldam o invisível. Você enxerga as estruturas do futuro e constrói pontes lógicas onde todos os outros veem apenas o caos. Nada acontece por acaso no seu reino mental; cada pilar é rigorosamente planejado."
            },
            observador: {
                image: "./resultado-observador.jpg",
                title: "Análise Profunda: O Observador",
                text: "Você habita o silêncio que antecede a revelação. Enquanto todos falam, você lê os entrelinhas, absorve o invisível e enxerga através das máscaras que a sociedade tenta vestir. Sua sabedoria reside na percepção sutil."
            }
        };

        let currentQuestion = 0;
        let scores = { estrategico: 0, intensivo: 0, arquiteto: 0, observador: 0 };
        let finalArchetype = '';

        function startQuiz() {
            document.getElementById('screen-welcome').classList.remove('active');
            document.getElementById('screen-quiz').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestion < questions.length) {
                const q = questions[currentQuestion];
                document.getElementById('question-title').innerText = q.title;
                
                const progress = ((currentQuestion) / questions.length) * 100;
                document.getElementById('progress-fill').style.width = progress + '%';

                const container = document.getElementById('options-container');
                container.innerHTML = '';

                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.text;
                    btn.onclick = () => selectAnswer(opt.archetype);
                    container.appendChild(btn);
                });
            } else {
                showResult();
            }
        }

        function selectAnswer(archetype) {
            scores[archetype]++;
            currentQuestion++;
            loadQuestion();
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');

            // Determinar arquétipo com desempate seguro
            finalArchetype = Object.keys(scores).reduce((a, b) => scores[a] >= scores[b] ? a : b);
            const data = resultsData[finalArchetype];

            // Inserção dos dados
            const imgElement = document.getElementById('result-img');
            imgElement.src = data.image;
            
            document.getElementById('analysis-title').innerText = data.title;
            document.getElementById('analysis-text').innerText = data.text;
        }

        async function shareResult() {
            const data = resultsData[finalArchetype];
            try {
                const response = await fetch(data.image);
                const blob = await response.blob();
                const file = new File([blob], `${finalArchetype}.jpg`, { type: 'image/jpeg' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Meu Diagnóstico - O Espelho do Teto',
                        text: 'Descubra seu perfil mental em O Espelho do Teto!'
                    });
                } else if (navigator.share) {
                    await navigator.share({
                        title: 'Meu Diagnóstico - O Espelho do Teto',
                        text: 'Descubra seu perfil mental em O Espelho do Teto!',
                        url: window.location.href
                    });
                } else {
                    alert('Para postar nos Stories: Pressione a imagem por alguns segundos para salvar ou tire um print da tela.');
                }
            } catch (error) {
                console.log('Erro ao compartilhar:', error);
                alert('Tire um print da tela ou salve a imagem para compartilhar nos Stories!');
            }
        }
    </script>
</body>
</html>
