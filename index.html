<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Espelho do Teto — Diagnóstico Psicológico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090B10;
      --card-bg: #11141D;
      --text-main: #E2E8F0;
      --text-muted: #94A3B8;
      --amber: #F59E0B;
      --amber-glow: rgba(245, 158, 11, 0.2);
      --blue-shadow: #1E293B;
      --border: #1E293B;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }


    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }


    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px var(--blue-shadow);
      position: relative;
    }


    header {
      text-align: center;
      margin-bottom: 28px;
    }


    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: var(--amber);
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }


    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }


    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 24px;
      overflow: hidden;
    }


    .progress-fill {
      height: 100%;
      background: var(--amber);
      width: 0%;
      transition: width 0.3s ease;
    }


    .question-title {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
      color: var(--text-main);
    }


    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }


    .option-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 10px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.2s ease;
    }


    .option-btn:hover {
      border-color: var(--amber);
      background: var(--amber-glow);
    }


    .result-card {
      display: none;
      text-align: left;
    }


    .result-tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--amber);
      margin-bottom: 8px;
    }


    .result-title {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      color: #FFF;
      margin-bottom: 16px;
    }


    .result-section {
      margin-bottom: 18px;
    }


    .result-section h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 4px;
    }


    .result-section p {
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.6;
    }


    .copy-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: var(--amber);
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }


    .copy-btn:hover {
      opacity: 0.9;
    }


    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>


  <div class="container">
    <header>
      <h1>O Espelho do Teto</h1>
      <p>Diagnóstico de Mecanismo de Defesa & Lucidez</p>
    </header>


    <div id="quiz-screen">
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="question-title" id="question-text">Carregando...</div>
      <div class="options" id="options-container"></div>
    </div>


    <div class="result-card" id="result-screen">
      <span class="result-tag" id="res-tag">Mecanismo Revelado</span>
      <h2 class="result-title" id="res-title"></h2>
      
      <div class="result-section">
        <h3>O Diagnóstico</h3>
        <p id="res-diag"></p>
      </div>


      <div class="result-section">
        <h3>O Espelhamento</h3>
        <p id="res-espelho"></p>
      </div>


      <div class="result-section">
        <h3>A Convocação</h3>
        <p id="res-convocacao"></p>
      </div>


      <button class="copy-btn" onclick="copyResult()">Copiar Diagnóstico para Print/Story</button>
    </div>


    <footer>
      @oobservadordeteto
    </footer>
  </div>


  <script>
    const questions = [
      {
        q: "1. Você apaga a luz do quarto e fica a sós no escuro. Qual é a primeira coisa que acontece na sua cabeça?",
        options: [
          { text: "Procuro uma explicação lógica para tudo o que senti no dia, tentando organizar as emoções como dados.", type: "A" },
          { text: "Pego o celular imediatamente e fico rolando a tela até o olho pesar, só para não encarar o silêncio.", type: "B" },
          { text: "Começo a repassar a lista de tarefas de amanhã e a projetar mentalmente cada cenário da semana.", type: "C" },
          { text: "Encaro o teto e percebo exatamente o que está errado na minha vida, mas não sinto forças para mover um dedo.", type: "D" }
        ]
      },
      {
        q: "2. Algo dá errado no seu dia e foge completamente do seu controle. Como você reage por dentro?",
        options: [
          { text: "Desligo o lado emocional na hora e busco uma solução fria, prática e analítica para resolver o problema.", type: "A" },
          { text: "Procuro uma fuga rápida — comida, vídeos barulhentos ou redes sociais — para fazer o incômodo sumir.", type: "B" },
          { text: "Fico irritado com a bagunça do imprevisível e tento reorganizar tudo ao redor para recuperar o domínio.", type: "C" },
          { text: "Entendo perfeitamente o motivo do erro e vejo o impacto de tudo, mas continuo parado assistindo às consequências.", type: "D" }
        ]
      },
      {
        q: "3. Você ganha duas horas livres no meio da tarde sem nenhuma obrigação. O que você faz?",
        options: [
          { text: "Uso o tempo de forma eficiente para organizar arquivos, estudar algo prático ou resolver pendências lógicas.", type: "A" },
          { text: "Deixo a TV ligada no fundo enquanto mexo no celular, preenchendo o vazio para não sentir o peso do tempo.", type: "B" },
          { text: "Uso cada minuto para planejar os próximos meses, desenhar metas ou estruturar novos projetos futuros.", type: "C" },
          { text: "Passo o tempo todo refletindo sobre quem eu me tornei e o que deveria mudar, mas não coloco nada em prática.", type: "D" }
        ]
      },
      {
        q: "4. Você precisa tomar uma decisão importante que vai mudar a sua rotina. Qual é o seu movimento?",
        options: [
          { text: "Faço uma lista fria de prós e contras e decido puramente com a razão, ignorando totalmente o que sinto.", type: "A" },
          { text: "Vou empurrando a escolha com a barriga, esperando que o tempo resolva ou que a vida decida por mim.", type: "B" },
          { text: "Tento prever todas as variáveis possíveis e crio planos de emergência antes de dar qualquer passo.", type: "C" },
          { text: "Enxergo com clareza cristalina qual seria a melhor escolha, mas paraliso na hora de agir e continuo no mesmo lugar.", type: "D" }
        ]
      },
      {
        q: "5. Um aperto desconfortável surge no seu peito sem aviso. Como você lida com essa sensação?",
        options: [
          { text: "Tento dissecá-la racionalmente: analiso a causa exata e trato a dor como um defeito técnico a ser corrigido.", type: "A" },
          { text: "Entro no modo automático e me ocupo com qualquer tarefa corrida para nem notar que a sensação está ali.", type: "B" },
          { text: "Tento antecipar o que pode acontecer de ruim se esse sentimento continuar e busco formas de me proteger.", type: "C" },
          { text: "Observo a minha própria angústia de fora, como um espectador distante da minha dor, sem fazer nada para sair dela.", type: "D" }
        ]
      },
      {
        q: "6. Quando você olha no espelho e encara a sua própria imagem por alguns segundos, o que passa pela sua mente?",
        options: [
          { text: "Enxergo um conjunto de hábitos e engrenagens que precisam ser ajustados para funcionar com mais eficiência.", type: "A" },
          { text: "Desvio o olhar rapidamente e procuro qualquer outra coisa no ambiente para me distrair.", type: "B" },
          { text: "Penso em quem eu preciso me tornar nos próximos anos e em tudo o que ainda preciso construir e controlar.", type: "C" },
          { text: "Vejo com clareza o abismo entre quem eu gostaria de ser e quem estou sendo hoje, mas continuo estático.", type: "D" }
        ]
      }
    ];


    const archetypes = {
      A: {
        title: "O CIRÚRGICO (A Lâmina)",
        diag: "Você racionaliza a vida para não precisar senti-la. Transforma angústias em equações lógicas porque tentar entender o motivo de uma dor parece mais seguro do que ter a coragem de ser vulnerável.",
        espelho: "Analisar o seu problema não é o mesmo que curá-lo. Sua inteligência virou um esconderijo refinado para o medo de perder o controle.",
        convocacao: "Pare de buscar justificativas lógicas para o que sente. Da próxima vez que um incômodo surgir, apenas suporte o peso dele por dois minutos em silêncio sem tentar explicá-lo."
      },
      B: {
        title: "O ANESTESIADO (O Nevoeiro)",
        diag: "O seu maior pavor é o silêncio. Você mantém a mente ocupada 24 horas por dia com telas, ruídos e tarefas rasas para garantir que nunca vai precisar encarar o abismo de estar a sós consigo mesmo.",
        espelho: "Você não está cansado do mundo; está exausto de rodar o piloto automático para anestesiar a própria presença.",
        convocacao: "Deixe o celular em outro cômodo hoje à noite. Encare o escuro do teto em silêncio absoluto até o sono vir, sem fugir para nenhum estímulo visual."
      },
      C: {
        title: "O ARQUITETO (A Estrutura)",
        diag: "Sua cabeça vive dez passos à frente, criando cenários e planos de emergência para coisas que nem aconteceram. Você acredita que, se planejar o suficiente, nada poderá te ferir.",
        espelho: "O seu perfeccionismo não é busca por excelência; é só o seu ego aterrorizado com a possibilidade de falhar. O excesso de preparação é uma desculpa elegante para não agir.",
        convocacao: "Escolha a decisão ou projeto que você está adiando há meses e dê o primeiro passo hoje — da forma mais imperfeita e simples possível."
      },
      D: {
        title: "O OBSERVADOR (A Testemunha)",
        diag: "Você enxerga com clareza absoluta onde está errando e entende os seus padrões destrutivos como ninguém. Porém, usa essa lucidez como uma cadeira de balanço.",
        espelho: "Você virou um espectador da própria existência. Lucidez sem ação não é sabedoria; é só covardia consciente.",
        convocacao: "Pare de analisar a sua estagnação. Escolha uma única atitude prática que quebre a sua rotina hoje e execute-a antes que a sua mente tente te convencer do contrário."
      }
    };


    let currentQ = 0;
    const scores = { A: 0, B: 0, C: 0, D: 0 };


    function loadQuestion() {
      const q = questions[currentQ];
      document.getElementById('question-text').innerText = q.q;
      
      const container = document.getElementById('options-container');
      container.innerHTML = '';


      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        container.appendChild(btn);
      });


      const progressPercent = ((currentQ) / questions.length) * 100;
      document.getElementById('progress').style.width = `${progressPercent}%`;
    }


    function selectOption(type) {
      scores[type]++;
      currentQ++;


      if (currentQ < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }


    function showResult() {
      document.getElementById('quiz-screen').style.display = 'none';
      const resultScreen = document.getElementById('result-screen');
      resultScreen.style.display = 'block';


      // Determina o arquétipo vencedor
      let winner = 'A';
      let maxScore = -1;
      for (const [type, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          winner = type;
        }
      }


      const res = archetypes[winner];
      document.getElementById('res-title').innerText = res.title;
      document.getElementById('res-diag').innerText = res.diag;
      document.getElementById('res-espelho').innerText = res.espelho;
      document.getElementById('res-convocacao').innerText = res.convocacao;
    }


    function copyResult() {
      const title = document.getElementById('res-title').innerText;
      const espelho = document.getElementById('res-espelho').innerText;
      const text = `Meu resultado no Espelho do Teto:\n\n${title}\n"${espelho}"\n\nDescubra o seu em: @oobservadordeteto`;
      
      navigator.clipboard.writeText(text).then(() => {
        alert('Resultado copiado! Agora você pode colar nos seus Stories ou enviar para alguém.');
      });
    }


    loadQuestion();
  </script>
</body>
</html>
