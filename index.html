<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Espelho do Teto — Diagnóstico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090E;
      --card-bg: rgba(13, 17, 26, 0.92);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --amber: #F59E0B;
      --amber-glow: rgba(245, 158, 11, 0.25);
      --border: rgba(245, 158, 11, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      /* Se quiser colocar a imagem de fundo que você gerou, coloque o link dela no lugar de 'url()' abaixo ou deixe limpo com este gradiente profundo */
      background-image: radial-gradient(circle at center, #111827 0%, #07090E 100%);
      background-size: cover;
      background-position: center;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 30px rgba(245, 158, 11, 0.05);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: var(--amber);
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--amber);
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .question-title {
      font-size: 1.2rem; /* Fonte confortável e de forte impacto visual */
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 24px;
      color: var(--text-main);
      text-align: center;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 20px 18px;
      border-radius: 14px;
      text-align: left;
      font-size: 1rem; /* 16px limpo e ideal para qualquer tela mobile */
      line-height: 1.5;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .option-btn:active, .option-btn:hover {
      border-color: var(--amber);
      background: var(--amber-glow);
      transform: translateY(-2px);
    }

    .result-card {
      display: none;
      text-align: left;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-tag {
      display: inline-block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--amber);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .result-title {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      color: #FFF;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .result-section {
      margin-bottom: 20px;
    }

    .result-section h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 6px;
      letter-spacing: 1.5px;
    }

    .result-section p {
      font-size: 1.05rem; /* Corpo de texto expandido para leitura imersiva */
      color: var(--text-main);
      line-height: 1.6;
    }

    .copy-btn {
      width: 100%;
      margin-top: 24px;
      padding: 18px;
      background: var(--amber);
      color: #07090E;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .copy-btn:hover {
      opacity: 0.9;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>O Espelho do Teto</h1>
      <p>Toque na verdade que você evita.</p>
    </header>

    <div id="quiz-screen">
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="question-title" id="question-text">Carregando...</div>
      <div class="options" id="options-container"></div>
    </div>

    <div class="result-card" id="result-screen">
      <span class="result-tag">Mecanismo Revelado</span>
      <h2 class="result-title" id="res-title"></h2>
      
      <div class="result-section">
        <h3>O Diagnóstico</h3>
        <p id="res-diag"></p>
      </div>

      <div class="result-section">
        <h3>O Espelhamento</h3>
        <p id="res-espelho"></p>
      </div>

      <div class="result-section">
        <h3>A Convocação</h3>
        <p id="res-convocacao"></p>
      </div>

      <button class="copy-btn" onclick="copyResult()">Copiar Resultado para os Stories</button>
    </div>

    <footer>
      @observadordeteto
    </footer>
  </div>

  <script>
    const questions = [
      {
        q: "Quando a sua rotina colapsa e o dia vira um caos imprevisível, o que a sua mente faz imediatamente?",
        options: [
          { text: "Isola a emoção e calcula uma saída técnica e fria.", type: "A" },
          { text: "Busca qualquer distração rápida para anestesiar o incômodo.", type: "B" },
          { text: "Tenta retomar o controle reorganizando tudo ao redor com urgência.", type: "C" },
          { text: "Enxerga o colapso com clareza, mas trava sem mover um músculo.", type: "D" }
        ]
      },
      {
        q: "No silêncio absoluto da noite, qual pensamento costuma vencer?",
        options: [
          { text: "Tentar decodificar o motivo lógico das minhas falhas diárias.", type: "A" },
          { text: "Ligar a tela e rolar o feed até o corpo apagar de exaustão.", type: "B" },
          { text: "Projetar cada detalhe e cobrança do que preciso resolver amanhã.", type: "C" },
          { text: "Assistir à minha própria estagnação como um espectador cansado.", type: "D" }
        ]
      },
      {
        q: "O que define a forma como você toma decisões importantes?",
        options: [
          { text: "Prós e contras matemáticos, anulando qualquer sentimento.", type: "A" },
          { text: "Adiar ao máximo até que o tempo decida por mim.", type: "B" },
          { text: "Planejamento obsessivo para garantir que nada saia do eixo.", type: "C" },
          { text: "Eu sei exatamente o que fazer, mas a inércia me paralisa.", type: "D" }
        ]
      },
      {
        q: "Encare o seu reflexo agora. O que a sua máscara esconde?",
        options: [
          { text: "O medo irracional de perder o controle e parecer vulnerável.", type: "A" },
          { text: "O pavor profundo de encarar o vazio de estar a sós comigo.", type: "B" },
          { text: "O terror secreto de falhar e ver meus planos desabarem.", type: "C" },
          { text: "A vergonha de ter lucidez suficiente para mudar, mas zero atitude.", type: "D" }
        ]
      }
    ];

    const archetypes = {
      A: {
        title: "O CIRÚRGICO (A Lâmina)",
        diag: "Você racionaliza a vida para não precisar senti-la. Transforma angústias em equações lógicas porque tentar entender o motivo de uma dor parece mais seguro do que ter a coragem de ser vulnerável.",
        espelho: "Analisar o seu problema não é o mesmo que curá-lo. Sua inteligência virou um esconderijo refinado para o medo de perder o controle.",
        convocacao: "Pare de buscar justificativas lógicas para o que sente. Suporte o peso do momento por dois minutos em silêncio sem tentar explicá-lo."
      },
      B: {
        title: "O ANESTESIADO (O Nevoeiro)",
        diag: "O seu maior pavor é o silêncio. Você mantém a mente ocupada o tempo todo com telas, ruídos e estímulos rasos para garantir que nunca vai precisar encarar o abismo de estar a sós consigo mesmo.",
        espelho: "Você não está cansado do mundo; está exausto de rodar o piloto automático para anestesiar a própria presença.",
        convocacao: "Deixe o celular em outro cômodo hoje. Encare o teto em silêncio absoluto até o sono vir, sem fugir para nenhum estímulo visual."
      },
      C: {
        title: "O ARQUITETO (A Estrutura)",
        diag: "Sua cabeça vive passos à frente, criando cenários e planos de emergência para coisas que nem aconteceram. Você acredita que, se planejar o suficiente, nada poderá te ferir.",
        espelho: "O seu perfeccionismo não é busca por excelência; é o seu ego aterrorizado com a falha. O excesso de preparação é uma desculpa elegante para não agir.",
        convocacao: "Escolha a decisão que você está adiando há meses e dê o primeiro passo hoje de forma imperfeita."
      },
      D: {
        title: "O OBSERVADOR (A Testemunha)",
        diag: "Você enxerga com clareza absoluta onde está errando e entende os seus padrões destrutivos como ninguém. Porém, usa essa lucidez como uma cadeira de balanço.",
        espelho: "Você virou um espectador da própria existência. Lucidez sem ação não é sabedoria; é só covardia consciente.",
        convocacao: "Pare de analisar a estagnação. Escolha uma única atitude prática que quebre a sua rotina hoje e execute-a imediatamente."
      }
    };

    let currentQ = 0;
    const scores = { A: 0, B: 0, C: 0, D: 0 };

    function loadQuestion() {
      const q = questions[currentQ];
      document.getElementById('question-text').innerText = q.q;
      
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        container.appendChild(btn);
      });

      const progressPercent = ((currentQ) / questions.length) * 100;
      document.getElementById('progress').style.width = `${progressPercent}%`;
    }

    function selectOption(type) {
      scores[type]++;
      currentQ++;

      if (currentQ < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').style.display = 'none';
      const resultScreen = document.getElementById('result-screen');
      resultScreen.style.display = 'block';

      let winner = 'A';
      let maxScore = -1;
      for (const [type, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          winner = type;
        }
      }

      const res = archetypes[winner];
      document.getElementById('res-title').innerText = res.title;
      document.getElementById('res-diag').innerText = res.diag;
      document.getElementById('res-espelho').innerText = res.espelho;
      document.getElementById('res-convocacao').innerText = res.convocacao;
    }

    function copyResult() {
      const title = document.getElementById('res-title').innerText;
      const espelho = document.getElementById('res-espelho').innerText;
      const text = `Meu resultado no Espelho do Teto:\n\n${title}\n"${espelho}"\n\nDescubra o seu em: @observadordeteto`;
      
      navigator.clipboard.writeText(text).then(() => {
        alert('Resultado copiado! Cole direto nos seus Stories.');
      });
    }

    loadQuestion();
  </script>
</body>
</html>
